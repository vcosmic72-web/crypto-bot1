
name: Trigger Make Webhook

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  send-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Send Data to Make.com Webhook
        run: |
          curl -X POST "https://hook.eu1.make.com/mcv7nm8lxiktbkvxnxiask6vmbvzfwrx" \
          -H "Content-Type: application/json" \
          -d '{"status": "Alerter triggered successfully", "source": "GitHub Actions"}'
